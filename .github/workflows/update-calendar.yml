name: Update hauler calendar

on:
  schedule:
    - cron: "17 * * * *"   # every hour (GitHub may run it a few minutes late)
  workflow_dispatch:        # "Run workflow" button for an instant update

permissions:
  contents: read            # never writes to the repo; message IDs live in the Actions cache

concurrency:
  group: hauler-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          if ! fc-list | grep -qi "DejaVu Sans"; then
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
          fi

      - name: Load saved Discord message IDs
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: hauler-state-${{ github.run_id }}
          restore-keys: hauler-state-

      - name: Draw calendar and update Discord
        env:
          CALENDARS: ${{ secrets.CALENDARS }}
          ALL_SECRETS: ${{ toJSON(secrets) }}   # picks up every CALENDAR_<TRUCK> secret
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          MONTHS: ${{ vars.MONTHS || '3' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/Los_Angeles' }}
        run: python hauler_calendar.py

      - name: Save Discord message IDs
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: hauler-state-${{ github.run_id }}-${{ github.run_attempt }}
